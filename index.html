<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the scene extend under the iPhone notch / home bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f2560" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>For Mama 🌸</title>
  <meta name="description" content="A little surprise, just for you 💌" />

  <!-- Link preview (Messenger / Viber / Telegram) — keeps the surprise hidden -->
  <meta property="og:title" content="For Mama 💌" />
  <meta property="og:description" content="A little surprise, just for you. Tap to open 🌸" />
  <meta property="og:type" content="website" />

  <!-- Favicon: a tiny Mesua flower -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Cg fill='%23fffdf7' stroke='%23eadfc3' stroke-width='2'%3E%3Cellipse cy='-22' rx='17' ry='22'/%3E%3Cellipse cy='22' rx='17' ry='22'/%3E%3Cellipse cx='-22' rx='22' ry='17'/%3E%3Cellipse cx='22' rx='22' ry='17'/%3E%3C/g%3E%3Ccircle r='13' fill='%23f7c531'/%3E%3C/svg%3E" />

  <!-- Fonts: Quicksand (body), Dancing Script (name), Padauk (Myanmar text) — only the weights we use -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Padauk&family=Quicksand:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="scene" class="scene" aria-label="A garden of blooming Mesua ferrea flowers">

    <!-- Layer 1: pastel twilight sky, stars, moon, clouds (Parts 2 + 11) -->
    <div id="sky" class="layer layer--sky" aria-hidden="true">
      <div class="sky__glow"></div>
      <div id="stars" class="sky__stars"></div>
      <div id="shooting-stars" class="sky__shooting"></div>

      <div class="moon">
        <div class="moon__halo"></div>
        <div class="moon__body"></div>
      </div>

      <!-- Fluffy clouds drift in front of the moon (filled by JS) -->
      <div id="clouds" class="sky__clouds"></div>

      <!-- Soft pastel hills, far → near; flowers grow from the front hill -->
      <svg class="ground" viewBox="0 0 400 160" preserveAspectRatio="none">
        <defs>
          <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3a6c8" />
            <stop offset="100%" stop-color="#c98bc0" />
          </linearGradient>
          <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a985cf" />
            <stop offset="100%" stop-color="#7c62ad" />
          </linearGradient>
          <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5d4a96" />
            <stop offset="100%" stop-color="#3a2d6b" />
          </linearGradient>
        </defs>
        <path class="ground__far" fill="url(#hillFar)" opacity="0.85"
          d="M0 52 C 50 30, 110 34, 160 46 S 290 18, 400 42 L 400 160 L 0 160 Z" />
        <path class="ground__back" fill="url(#hillBack)"
          d="M0 70 C 60 40, 120 45, 180 62 S 300 30, 400 55 L 400 160 L 0 160 Z" />
        <path class="ground__front" fill="url(#hillFront)"
          d="M0 105 C 70 85, 140 95, 210 100 S 330 82, 400 98 L 400 160 L 0 160 Z" />
      </svg>
    </div>

    <!-- Layer 2: ground + flowers (Parts 3–5) -->
    <div id="garden" class="layer layer--garden" aria-hidden="true"></div>

    <!-- Layer 3: fireflies, pollen, falling petals (Part 6) -->
    <canvas id="particles" class="layer layer--particles" aria-hidden="true"></canvas>

    <!-- Layer 4: love message (Part 7) — filled in by js/message.js -->
    <section id="message" class="layer layer--message" lang="my"></section>

    <!-- Layer 5: intro "tap to open" envelope (Part 7) -->
    <section id="intro" class="layer layer--intro">
      <button class="intro__button" type="button" aria-label="Open your surprise">
        <span class="envelope" aria-hidden="true">
          <span class="envelope__back"></span>
          <span class="envelope__letter">
            <svg class="envelope__flower" viewBox="-80 -80 160 160"></svg>
          </span>
          <span class="envelope__front"></span>
          <span class="envelope__flap"></span>
          <span class="envelope__seal">♥</span>
        </span>
        <span class="intro__to">
          <span class="intro__name">Mama</span>
          <span class="my" lang="my">အတွက်</span>
        </span>
        <span class="intro__hint my" lang="my">နှိပ်ပြီး ဖွင့်ကြည့်ပါ</span>
      </button>
    </section>

    <!-- Controls: music toggle (Part 8) -->
    <div id="controls" class="controls"></div>

    <!-- "Tap to bloom" hint, shown after the message (Part 8) -->
    <p id="tap-hint" class="tap-hint my" lang="my">နှိပ်ပြီး ပန်းလေးတွေ ပွင့်စေပါ 🌸</p>
  </main>

  <!-- GSAP for timeline animations (local copy, so it works even if a CDN is blocked/slow) -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/growth.js"></script>
  <script src="js/bloom.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/message.js"></script>
  <script src="js/music.js"></script>
  <script src="js/interact.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
