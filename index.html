<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the scene extend under the iPhone notch / home bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>For Mama 🌸</title>
  <meta name="description" content="A little garden of Mesua ferrea flowers, blooming just for you." />

  <!-- Fonts: Quicksand (body), Dancing Script (name), Padauk (Myanmar text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Padauk:wght@400;700&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="scene" class="scene" aria-label="A garden of blooming Mesua ferrea flowers">

    <!-- Layer 1: night sky, stars, moon (Part 2) -->
    <div id="sky" class="layer layer--sky" aria-hidden="true">
      <div class="sky__glow"></div>
      <div id="stars" class="sky__stars"></div>
      <div id="shooting-stars" class="sky__shooting"></div>

      <div class="moon">
        <div class="moon__halo"></div>
        <div class="moon__body"></div>
      </div>

      <!-- Soft rolling hills; flowers will grow from the front hill -->
      <svg class="ground" viewBox="0 0 400 160" preserveAspectRatio="none">
        <defs>
          <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a2150" />
            <stop offset="100%" stop-color="#171230" />
          </linearGradient>
          <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a1532" />
            <stop offset="100%" stop-color="#0d0a1c" />
          </linearGradient>
        </defs>
        <path class="ground__back" fill="url(#hillBack)"
          d="M0 70 C 60 40, 120 45, 180 62 S 300 30, 400 55 L 400 160 L 0 160 Z" />
        <path class="ground__front" fill="url(#hillFront)"
          d="M0 105 C 70 85, 140 95, 210 100 S 330 82, 400 98 L 400 160 L 0 160 Z" />
      </svg>
    </div>

    <!-- Layer 2: ground + flowers (Parts 3–5) -->
    <div id="garden" class="layer layer--garden" aria-hidden="true"></div>

    <!-- Layer 3: fireflies, pollen, falling petals (Part 6) -->
    <canvas id="particles" class="layer layer--particles" aria-hidden="true"></canvas>

    <!-- Layer 4: love message (Part 7) -->
    <section id="message" class="layer layer--message" aria-live="polite"></section>

    <!-- Layer 5: intro "tap to open" screen (Part 7) -->
    <section id="intro" class="layer layer--intro"></section>

    <!-- Controls: music toggle (Part 8) -->
    <div id="controls" class="controls"></div>
  </main>

  <!-- GSAP for timeline animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/growth.js"></script>
  <script src="js/bloom.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
