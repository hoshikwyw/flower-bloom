<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the scene extend under the iPhone notch / home bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>For Mama 🌸</title>
  <meta name="description" content="A little garden of Mesua ferrea flowers, blooming just for you." />

  <!-- Fonts: Quicksand (body), Dancing Script (name), Padauk (Myanmar text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Padauk:wght@400;700&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="scene" class="scene" aria-label="A garden of blooming Mesua ferrea flowers">

    <!-- Layer 1: night sky, stars, moon (Part 2) -->
    <div id="sky" class="layer layer--sky" aria-hidden="true"></div>

    <!-- Layer 2: ground + flowers (Parts 3–5) -->
    <div id="garden" class="layer layer--garden" aria-hidden="true"></div>

    <!-- Layer 3: fireflies, pollen, falling petals (Part 6) -->
    <canvas id="particles" class="layer layer--particles" aria-hidden="true"></canvas>

    <!-- Layer 4: love message (Part 7) -->
    <section id="message" class="layer layer--message" aria-live="polite"></section>

    <!-- Layer 5: intro "tap to open" screen (Part 7) -->
    <section id="intro" class="layer layer--intro"></section>

    <!-- Controls: music toggle (Part 8) -->
    <div id="controls" class="controls"></div>
  </main>

  <!-- GSAP for timeline animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
